<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>新华字典 · Photo Pinyin</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- Top navigation bar (Pleco-style) -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="app-logo">字</span>
      <span class="app-title" data-i18n="appTitle">新华字典</span>
    </div>
    <div class="topbar-right">
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
    </div>
  </header>

  <!-- Main content area -->
  <main class="content">

    <!-- Camera / Capture panel (slides out from the bottom when needed) -->
    <section id="capture-screen" class="screen camera-panel">
      <div class="camera-panel-handle"></div>
      <div class="camera-panel-header">
        <span class="camera-panel-title" data-i18n="cameraPanelTitle">拍照识别</span>
        <button id="camera-close-btn" class="btn btn-small" data-i18n="cameraCloseBtn">完成</button>
      </div>
      <div class="capture-card">
        <div class="camera-wrap">
          <video id="camera" autoplay playsinline muted></video>
          <div class="camera-overlay" id="camera-overlay">
            <div class="frame-guide"></div>
            <p class="overlay-hint" data-i18n="overlayHint">将文字对准取景框</p>
          </div>
          <canvas id="camera-canvas" style="display:none"></canvas>
        </div>

        <div class="capture-actions">
          <button id="capture-btn" class="btn btn-capture" disabled>
            <span class="btn-icon">📷</span>
            <span class="btn-label" data-i18n="captureBtn">拍照</span>
          </button>
          <label class="btn btn-upload" for="file-input">
            <span class="btn-icon">🖼️</span>
            <span class="btn-label" data-i18n="uploadBtn">上传图片</span>
          </label>
          <input type="file" id="file-input" accept="image/*" capture="environment" hidden />
        </div>

        <p id="camera-status" class="status"></p>
      </div>
    </section>

    <!-- Processing screen -->
    <section id="processing-screen" class="screen">
      <div class="processing-card">
        <div class="spinner"></div>
        <h2 data-i18n="processingTitle">识别中…</h2>
        <p id="processing-status" data-i18n="processingStatus">正在读取文字</p>
      </div>
    </section>

    <!-- Dictionary screen: one search box, Pleco-style — type pinyin or
         hanzi and it auto-detects which lookup to run. -->
    <section id="dict-screen" class="screen">
      <div class="search-bar-wrap">
        <div class="search-input-row">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input
            id="dict-search-input"
            class="pinyin-search-input"
            type="text"
            inputmode="text"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            data-i18n-placeholder="searchPlaceholder"
            placeholder="拼音或汉字，如 nihao / 你好"
          />
          <span id="search-mode-badge" class="mode-badge" hidden></span>
          <button id="dict-clear-btn" class="clear-btn" aria-label="Clear" hidden>&times;</button>
        </div>
      </div>

      <!-- Shown when the search box is empty: saved words + recent lookups -->
      <div id="dict-idle" class="idle-panel">
        <div id="saved-section" class="idle-section" hidden>
          <h3 class="idle-heading" data-i18n="savedHeading">收藏</h3>
          <div id="saved-list" class="word-list"></div>
        </div>
        <div id="history-section" class="idle-section" hidden>
          <div class="idle-heading-row">
            <h3 class="idle-heading" data-i18n="historyHeading">最近查找</h3>
            <button id="clear-history-btn" class="link-btn" data-i18n="clearHistory">清除</button>
          </div>
          <div id="history-list" class="history-list"></div>
        </div>
        <div id="dict-empty-hint" class="empty-state">
          <div class="empty-icon">📖</div>
          <p data-i18n="dictHint">输入拼音或汉字，例如 "nihao" 或 "你好"。</p>
        </div>
      </div>

      <div id="dict-results" class="word-list"></div>
    </section>

    <!-- Result screen -->
    <section id="result-screen" class="screen">
      <!-- Segmented control (Pleco-style) -->
      <div class="segmented-control">
        <button id="tab-page-btn" class="seg-btn active" data-i18n="segPage">页面</button>
        <button id="tab-words-btn" class="seg-btn" data-i18n="segWords">词汇</button>
      </div>

      <!-- Page view: annotated image -->
      <div id="page-view" class="view active">
        <div class="result-toolbar">
          <button id="back-btn" class="btn btn-small" data-i18n="backBtn">← 新照片</button>
          <div class="result-actions">
            <button id="toggle-pinyin-btn" class="btn btn-small" data-i18n="hidePinyinBtn">隐藏拼音</button>
          </div>
        </div>
        <div id="result-container" class="result-container">
          <!-- The annotated image is rendered here -->
        </div>
        <p class="page-hint" data-i18n="pageTapHint">点击文字块查看词义</p>
      </div>

      <!-- Words view: dictionary-style list -->
      <div id="words-view" class="view">
        <div class="words-toolbar">
          <span class="words-count" id="words-count"></span>
        </div>
        <div id="word-list" class="word-list"></div>
      </div>
    </section>

    <!-- Settings screen -->
    <section id="settings-screen" class="screen">
      <div class="settings-group">
        <h3 class="settings-heading" data-i18n="settingsDefaultsHeading">默认设置</h3>
        <div class="settings-row">
          <span class="settings-row-label" data-i18n="settingShowPinyin">默认显示拼音</span>
          <button id="setting-show-pinyin" class="toggle-switch" role="switch" aria-checked="true">
            <span class="toggle-knob"></span>
          </button>
        </div>
        <div class="settings-row">
          <span class="settings-row-label" data-i18n="settingShowDefs">默认展开释义</span>
          <button id="setting-show-defs" class="toggle-switch" role="switch" aria-checked="false">
            <span class="toggle-knob"></span>
          </button>
        </div>
      </div>

      <div class="settings-group">
        <h3 class="settings-heading" data-i18n="settingsCameraHeading">相机</h3>
        <div class="settings-row">
          <span class="settings-row-label" data-i18n="settingCameraFacing">默认摄像头</span>
          <select id="setting-camera-facing" class="settings-select">
            <option value="environment" data-i18n="cameraBack">后置</option>
            <option value="user" data-i18n="cameraFront">前置</option>
          </select>
        </div>
      </div>

      <div class="settings-group">
        <h3 class="settings-heading" data-i18n="settingsSavedHeading">收藏</h3>
        <div class="settings-row settings-row-static">
          <span class="settings-row-label" data-i18n="settingSavedCount">已收藏的词</span>
          <span class="settings-row-value" id="saved-count-value">0</span>
        </div>
        <div class="settings-row">
          <span class="settings-row-label" data-i18n="settingClearSaved">清除全部收藏</span>
          <button id="clear-saved-btn" class="btn btn-small btn-danger" data-i18n="clearBtn">清除</button>
        </div>
      </div>

      <div class="settings-group">
        <h3 class="settings-heading" data-i18n="settingsAboutHeading">关于</h3>
        <div class="settings-row settings-row-static">
          <span class="settings-row-label" data-i18n="settingVersion">版本</span>
          <span class="settings-row-value">1.0.0</span>
        </div>
        <p class="settings-note" data-i18n="settingsCedictNote">
          词典数据来自 CC-CEDICT，采用 CC BY-SA 4.0 协议授权。
        </p>
      </div>
    </section>
  </main>

  <!-- Bottom tab bar (Pleco-style) -->
  <nav class="tabbar">
    <button class="tab-btn active" data-tab="camera">
      <span class="tab-icon">📷</span>
      <span class="tab-label" data-i18n="tabCamera">相机</span>
    </button>
    <button class="tab-btn" data-tab="dict" id="dict-tab-btn">
      <span class="tab-icon">📖</span>
      <span class="tab-label" data-i18n="tabDict">词典</span>
    </button>
    <button class="tab-btn" data-tab="results" id="results-tab-btn">
      <span class="tab-icon">📄</span>
      <span class="tab-label" data-i18n="tabResults">结果</span>
    </button>
    <button class="tab-btn" data-tab="settings">
      <span class="tab-icon">⚙️</span>
      <span class="tab-label" data-i18n="tabSettings">设置</span>
    </button>
  </nav>

  <script src="/static/app.js"></script>
</body>
</html>
